{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  {% include "partials/head.html" %}

  <title>Page Not Found | Vitamova</title>

  <style>
    :root {
      --vita-yellow: #ffd54a;
      --vita-blue: #1f5eff;
      --text-dark: #1a1f36;
      --text-muted: #667085;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 213, 74, 0.28), transparent 38%),
        radial-gradient(circle at 90% 20%, rgba(31, 94, 255, 0.20), transparent 42%),
        linear-gradient(180deg, #ffffff 0%, #f7f9ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 680px;
      width: 100%;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #e6eaf2;
      border-radius: 32px;
      box-shadow: 0 24px 70px rgba(24, 42, 100, 0.12);
      padding: 48px 28px;
      text-align: center;
    }

    .badge {
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      border-radius: 24px;
      background: var(--vita-yellow);
      color: var(--vita-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    p {
      margin: 18px auto 0;
      max-width: 52ch;
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--vita-blue);
      color: white;
      text-decoration: none;
      font-weight: 850;
      box-shadow: 0 14px 30px rgba(31, 94, 255, 0.24);
    }

    .btn:hover {
      background: #1748c6;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">?</div>

    <h1>404</h1>

    <p>
      This page wandered off somewhere. Let’s get you back to your language-learning path.
    </p>

    <div class="actions">
      <a class="btn" href="/">
        Return home
      </a>
    </div>
  </main>
</body>
</html>
