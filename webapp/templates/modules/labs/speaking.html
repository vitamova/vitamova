{% load static %}

<!DOCTYPE html>
<html>
<head>
  <title>Reading Test</title>
</head>
<body>
  <h1>Reading Test</h1>

  <p>Language: {{ language }}</p>

  <button id="startBtn">Start</button>
  <button id="stopBtn" disabled>Stop</button>

  <h2>Read this:</h2>
  <p id="passage"></p>

  <h2>Transcript</h2>
  <p id="transcript"></p>

  <h2>Results</h2>
  <p>Time: <span id="timeResult">-</span></p>
  <p>WPM: <span id="wpmResult">-</span></p>
  <p>Accuracy: <span id="accuracyResult">-</span></p>

  {{ passage_text|json_script:"passageText" }}
  {{ language|json_script:"languageCode" }}
  {{ openai_client_secret|json_script:"openaiClientSecret" }}

  <script>
    const passageText = JSON.parse(document.getElementById("passageText").textContent);
    const languageCode = JSON.parse(document.getElementById("languageCode").textContent);
    const openaiClientSecret = JSON.parse(document.getElementById("openaiClientSecret").textContent);

    const passageEl = document.getElementById("passage");
    const transcriptEl = document.getElementById("transcript");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    const timeResult = document.getElementById("timeResult");
    const wpmResult = document.getElementById("wpmResult");
    const accuracyResult = document.getElementById("accuracyResult");

    let pc = null;
    let dc = null;
    let stream = null;
    let startTime = null;
    let finalTranscript = "";
    let currentWordIndex = 0;
    let mismatchSound = null;

    const expectedWords = tokenize(passageText);

    function tokenize(text) {
      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\p{L}\p{N}\s]/gu, "")
        .split(/\s+/)
        .filter(Boolean);
    }

    function renderPassage() {
      passageEl.innerHTML = "";

      const rawWords = passageText.split(/\s+/);

      rawWords.forEach((word, index) => {
        const span = document.createElement("span");
        span.textContent = word + " ";
        span.id = "word-" + index;
        span.style.color = "black";
        passageEl.appendChild(span);
      });
    }

    function playErrorNoise() {
      const ctx = new AudioContext();
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();

      oscillator.frequency.value = 180;
      oscillator.type = "square";

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      oscillator.start();
      oscillator.stop(ctx.currentTime + 0.12);
    }

    function markWord(index, color) {
      const el = document.getElementById("word-" + index);
      if (el) {
        el.style.color = color;
      }
    }

    function processTranscript(newTranscript) {
      transcriptEl.textContent = newTranscript;

      const spokenWords = tokenize(newTranscript);

      for (let i = currentWordIndex; i < spokenWords.length && i < expectedWords.length; i++) {
        if (spokenWords[i] === expectedWords[i]) {
          markWord(i, "green");
        } else {
          markWord(i, "red");
          playErrorNoise();
        }

        currentWordIndex = i + 1;
      }
    }

    async function startReading() {
      renderPassage();

      startBtn.disabled = true;
      stopBtn.disabled = false;

      startTime = performance.now();
      finalTranscript = "";
      currentWordIndex = 0;

      stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      pc = new RTCPeerConnection();

      stream.getTracks().forEach(track => {
        pc.addTrack(track, stream);
      });

      dc = pc.createDataChannel("oai-events");

      dc.onopen = () => {
        dc.send(JSON.stringify({
          type: "session.update",
          session: {
            type: "transcription",
            audio: {
              input: {
                transcription: {
                  model: "gpt-realtime-whisper",
                  language: languageCode
                }
              }
            }
          }
        }));
      };

      dc.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "conversation.item.input_audio_transcription.delta") {
          finalTranscript += msg.delta;
          processTranscript(finalTranscript);
        }

        if (msg.type === "conversation.item.input_audio_transcription.completed") {
          finalTranscript = msg.transcript;
          processTranscript(finalTranscript);
        }
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

    const response = await fetch("https://api.openai.com/v1/realtime/calls", {
    method: "POST",
    headers: {
        "Authorization": "Bearer " + clientSecret,
        "Content-Type": "application/sdp"
    },
    body: offer.sdp
    });

      const answer = {
        type: "answer",
        sdp: await response.text()
      };

      await pc.setRemoteDescription(answer);
    }

    function stopReading() {
      stopBtn.disabled = true;
      startBtn.disabled = false;

      const endTime = performance.now();
      const seconds = (endTime - startTime) / 1000;
      const minutes = seconds / 60;

      const spokenWords = tokenize(finalTranscript);
      let correct = 0;

      for (let i = 0; i < expectedWords.length; i++) {
        if (spokenWords[i] === expectedWords[i]) {
          correct++;
        }
      }

      const wpm = Math.round(correct / minutes);
      const accuracy = Math.round((correct / expectedWords.length) * 100);

      timeResult.textContent = seconds.toFixed(1) + " seconds";
      wpmResult.textContent = wpm;
      accuracyResult.textContent = accuracy + "%";

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      if (dc) {
        dc.close();
      }

      if (pc) {
        pc.close();
      }
    }

    startBtn.addEventListener("click", startReading);
    stopBtn.addEventListener("click", stopReading);

    renderPassage();
  </script>
</body>
</html>
