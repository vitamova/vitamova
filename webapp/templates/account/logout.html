<!DOCTYPE html>
<html lang="en">
<head>
  {% include "partials/head.html" %}

  <title>Vitamova | Sign Out</title>

  <style>
    :root {
      --vita-yellow: #ffd54a;
      --vita-blue: #1f5eff;
      --vita-blue-dark: #1748c6;
      --bg-soft: #f7f9ff;
      --text-dark: #1a1f36;
      --text-muted: #667085;
      --card: #ffffff;
      --border: #e6eaf2;
      --shadow: 0 18px 45px rgba(24, 42, 100, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 213, 74, 0.25), transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(31, 94, 255, 0.20), transparent 42%),
        linear-gradient(180deg, #fdfefe 0%, var(--bg-soft) 100%);
      min-height: 100vh;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 720px;
      min-height: calc(100vh - 48px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.2px;
      color: var(--text-dark);
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(20, 27, 52, 0.08);
    }

    .brand-icon {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 34px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 auto;
      color: var(--text-muted);
      max-width: 54ch;
      line-height: 1.55;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
    }

    .btn-primary {
      background: var(--vita-blue);
      color: white;
      box-shadow: 0 8px 20px rgba(31, 94, 255, 0.18);
    }

    .btn-primary:hover {
      background: var(--vita-blue-dark);
    }

    .btn-secondary {
      background: white;
      color: var(--vita-blue);
      border: 1px solid rgba(31, 94, 255, 0.22);
    }

    .btn-secondary:hover {
      background: #fbfcff;
      border-color: rgba(31, 94, 255, 0.35);
    }

    @media (max-width: 720px) {
      body {
        padding: 18px;
      }

      .page {
        min-height: calc(100vh - 36px);
      }

      .card {
        padding: 28px 20px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="brand">
      <div class="brand-badge">
        <img src="/static/icon.png" alt="Vitamova icon" class="brand-icon">
      </div>
      <span>Vitamova</span>
    </div>

    <section class="card" aria-label="Sign out confirmation">
      <h1>Sign out of Vitamova?</h1>

      <p>
        Your progress is saved. Come back anytime to keep building your vocabulary.
      </p>

      <div class="actions">
        <form method="POST" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <button class="btn btn-primary" type="submit">
            Sign out
          </button>
        </form>

        <a class="btn btn-secondary" href="/">
          Stay signed in
        </a>
      </div>
    </section>
  </main>
</body>
</html>
